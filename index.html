<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <title>Abaya Hub UAE | Best Abaya Wholesaler in UAE & Dubai</title>
    <meta name="description" content="Abaya Hub UAE - No.1 Best Abaya Wholesaler in UAE, Dubai. Premium wholesale and retail Abaya collection with worldwide shipping. Best prices and quality.">
    <meta name="keywords" content="Abaya wholesaler, dubai abaya, abaya uae, abaya hub, abaya hub uae, Best abaya Wholesaler, best Abaya wholesaler uae, wholesale abaya dubai, cheap abaya uae">
    <meta name="author" content="Abaya Hub UAE">
    
    <meta property="og:title" content="Abaya Hub UAE | Premium Boutique & Wholesaler">
    <meta property="og:description" content="Best Abaya Wholesaler in UAE and Dubai. Worldwide delivery.">
    <meta property="og:url" content="https://abayahubuae.shop">
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Tenor+Sans&family=Cairo:wght@300;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root { --primary-pink: #f4aaff; --deep-pink: #ff00ff; --black: #050505; --text-gradient: linear-gradient(180deg, #ffffff 0%, #f4aaff 100%); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tenor Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        html, body { overflow-x: hidden; width: 100%; position: relative; touch-action: manipulation; background-color: var(--black); color: white; scroll-behavior: smooth; }
        .rtl { direction: rtl; font-family: 'Cairo', sans-serif !important; }

        /* PRELOADER */
        #preloader { position: fixed; inset: 0; background: var(--black); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .loader-icon { width: auto; max-width: 150px; opacity: 0; transform: scale(0.8); }

        /* Navigation Header */
        nav { padding: 12px 5%; position: fixed; width: 100%; top: 0; z-index: 1000; background: rgba(5, 5, 5, 0.95); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(244,170,255,0.1); display: flex; justify-content: space-between; align-items: center; }
        .logo-img { height: 40px; }
        .nav-right { display: flex; gap: 8px; align-items: center; }
        .social-links { display: flex; gap: 10px; align-items: center; }
        .social-links a { color: var(--primary-pink); font-size: 17px; }
        #arBtn { background: transparent; color: var(--primary-pink); border: 1px solid var(--primary-pink); padding: 4px 10px; border-radius: 5px; font-size: 11px; cursor: pointer; }

        /* --- STICKY BAR --- */
        .sticky-locked-header { position: fixed; top: 65px; left: 0; width: 100%; z-index: 950; background: var(--black); padding: 15px 5% 5px; border-bottom: 1px solid rgba(244,170,255,0.1); }
        .search-box { width: 100%; max-width: 500px; padding: 10px 20px; border-radius: 50px; border: 1px solid var(--primary-pink); background: #111; color: white; outline: none; margin-bottom: 10px; font-size: 14px; display: block; margin-left: auto; margin-right: auto; }
        .category-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; scrollbar-width: none; }
        .cat-btn { padding: 6px 18px; border-radius: 20px; border: 1px solid var(--primary-pink); background: transparent; color: white; white-space: nowrap; cursor: pointer; font-size: 11px; }
        .cat-btn.active { background: var(--primary-pink); color: black; font-weight: bold; }

        /* Hero Area */
        .hero-area { padding: 180px 5% 10px; text-align: center; position: relative; }
        .hero-dynamic-container { position: relative; width: 100%; height: 230px; display: flex; justify-content: center; align-items: center; }
        #welcomeMessage { position: absolute; width: 100%; opacity: 0; transform: translateY(20px); z-index: 5; pointer-events: none; }
        .welcome-title { font-family: 'Cinzel', serif; font-size: 22px; letter-spacing: 3px; background: var(--text-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .slider-wrapper { width: 100%; height: 220px; overflow: hidden; border-radius: 20px; position: absolute; border: 1px solid rgba(244,170,255,0.2); opacity: 0; visibility: hidden; z-index: 1; }
        .slider-track { display: flex; height: 100%; transition: transform 0.6s ease-in-out; }
        .slide { min-width: 100%; height: 100%; }
        .slide img { width: 100%; height: 100%; object-fit: cover; }
        .slider-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: var(--primary-pink); border: none; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; z-index: 20; display: flex; align-items: center; justify-content: center; font-size: 16px; }

        /* Grid */
        .collection-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 20px 5% 100px; }
        @media (min-width: 768px) { .collection-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; } }
        .abaya-card { background: #0f0f0f; border-radius: 12px; overflow: hidden; border: 1px solid #1a1a1a; cursor: pointer; }
        .abaya-card img { width: 100%; height: 240px; object-fit: cover; }

        /* Related Products Section */
        .related-container { margin-top: 30px; border-top: 1px solid #222; padding-top: 20px; }
        .related-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 15px; scrollbar-width: none; }
        .rel-card { min-width: 120px; background: #111; border-radius: 10px; overflow: hidden; border: 1px solid #222; cursor: pointer; }
        .rel-card img { width: 100%; height: 130px; object-fit: cover; }
        .rel-card p { font-size: 10px; padding: 6px; color: #fff; text-align: center; }

        /* --- PINCH ZOOM FULL-VIEW --- */
        #fullView { display:none; position:fixed; inset:0; background:rgba(0,0,0,1); z-index:6000; justify-content:center; align-items:center; overflow: hidden; touch-action: none; }
        #fullView img { max-width: 100%; max-height: 90vh; object-fit: contain; transform-origin: center center; transition: transform 0.1s ease-out; }
        .full-close { position:absolute; top:20px; right:20px; font-size:35px; color:white; cursor:pointer; z-index: 7000; }

        /* Size Selection */
        .size-opt { padding: 12px; border: 1px solid rgba(244,170,255,0.3); text-align: center; border-radius: 10px; cursor: pointer; font-size: 14px; color: white; background: rgba(255,255,255,0.05); transition: 0.3s; }
        .size-opt.selected { border-color: var(--primary-pink); background: var(--primary-pink); color: black; font-weight: bold; }

        .cart-float { position: fixed; bottom: 30px; right: 25px; width: 60px; height: 60px; background: var(--deep-pink); border-radius: 50%; display: flex; justify-content: center; align-items: center; z-index: 2000; box-shadow: 0 5px 15px rgba(255,0,255,0.3); }
        #backToTop { position: fixed; bottom: 35px; left: 50%; transform: translateX(-50%); width: 45px; height: 45px; background: #222; border: 1px solid var(--primary-pink); color: var(--primary-pink); border-radius: 50%; display: none; justify-content: center; align-items: center; z-index: 1999; cursor: pointer; }
    </style>
</head>
<body id="mainBody">

    <div id="preloader"><img src="icon.png" alt="Icon" class="loader-icon" id="loadIcon"></div>

    <nav>
        <img src="logo.png" alt="Abaya Hub" class="logo-img">
        <div class="nav-right">
            <button id="arBtn" onclick="toggleArabic()">ARABIC</button>
            <div class="social-links">
                <a href="https://www.facebook.com/abayahubuae" target="_blank" aria-label="Facebook"><i class="fab fa-facebook-f"></i></a>
                <a href="https://www.instagram.com/abayahub_uae" target="_blank" aria-label="Instagram"><i class="fab fa-instagram"></i></a>
                <a href="https://www.tiktok.com/@abayahub.uae" target="_blank" aria-label="TikTok"><i class="fab fa-tiktok"></i></a>
                <a href="https://wa.me/971568679647" target="_blank" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
            </div>
        </div>
    </nav>

    <div class="sticky-locked-header">
        <input type="text" id="searchBar" class="search-box" placeholder="Search Abaya..." oninput="applyFilters()">
        <div class="category-bar" id="dynamicCats"></div>
    </div>

    <div class="hero-area">
        <div class="hero-dynamic-container">
            <div id="welcomeMessage">
                <h2 class="welcome-title" id="wt">Welcome To Abaya Hub UAE</h2>
                <p id="ws" style="color:var(--primary-pink); font-style:italic; font-size:13px;">The Best Abaya Collections in UAE</p>
            </div>
            <div class="slider-wrapper" id="heroSlider">
                <button class="slider-btn" style="left:10px" onclick="moveSlide(-1)" aria-label="Prev"><i class="fas fa-chevron-left"></i></button>
                <div class="slider-track" id="sliderTrack"></div>
                <button class="slider-btn" style="right:10px" onclick="moveSlide(1)" aria-label="Next"><i class="fas fa-chevron-right"></i></button>
            </div>
        </div>
    </div>

    <main class="collection-grid" id="productGrid"></main>

    <div id="productModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:5000; justify-content:center; align-items:center; padding:20px;">
        <div id="modalContent" style="background:#0a0a0a; width:100%; max-width:450px; border-radius:25px; padding:25px; border:1px solid #222; max-height:90vh; overflow-y:auto;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3 id="mName" style="color:var(--primary-pink); font-family:'Cinzel';"></h3>
                <span onclick="closeModal()" style="cursor:pointer; font-size:24px;">&times;</span>
            </div>
            
            <div style="position:relative;">
                <img id="mImg" src="" onclick="openFullView()" style="width:100%; height:280px; object-fit:cover; border-radius:15px; margin-bottom:15px; border:1px solid #111; cursor:zoom-in;" alt="Product Image">
            </div>

            <p id="mDesc" style="font-size:13px; color:#aaa; margin-bottom:15px; line-height:1.4;"></p>
            <p id="mSizeLabel" style="font-size:12px; font-weight:bold; color:var(--primary-pink); margin-bottom:10px;">SELECT SIZE:</p>
            <div id="mSizes" style="display:grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px;"></div>
            
            <button onclick="toggleCustom()" style="width:100%; border:1px dashed var(--primary-pink); padding:12px; border-radius:12px; color:white; background:transparent; font-size:11px; cursor:pointer;">USE CUSTOM MEASUREMENT</button>
            
            <div id="mCustomBox" style="display:none; margin-top:15px; border-top:1px solid #222; padding-top:15px;">
                <input type="text" id="cH" placeholder="Height" style="width:100%; padding:12px; background:#000; border:1px solid #333; color:white; border-radius:10px; margin-bottom:8px; font-size:12px;">
                <input type="text" id="cC" placeholder="Chest" style="width:100%; padding:12px; background:#000; border:1px solid #333; color:white; border-radius:10px; margin-bottom:8px; font-size:12px;">
                <input type="text" id="cL" placeholder="Length" style="width:100%; padding:12px; background:#000; border:1px solid #333; color:white; border-radius:10px; margin-bottom:8px; font-size:12px;">
            </div>

            <button style="width:100%; margin-top:20px; background:var(--primary-pink); color:black; font-weight:bold; padding:16px; border-radius:15px; border:none;" onclick="confirmOrder()">ADD TO BAG</button>

            <div class="related-container">
                <p style="font-size:12px; font-weight:bold; color:var(--primary-pink); margin-bottom:12px;">YOU MAY ALSO LIKE</p>
                <div class="related-scroll" id="relatedSection"></div>
            </div>
        </div>
    </div>

    <div id="fullView">
        <span class="full-close" onclick="closeFullView()">&times;</span>
        <img id="fImg" src="" draggable="false" alt="Zoomed Image">
    </div>

    <button id="backToTop" onclick="scrollToTop()" aria-label="Back to Top"><i class="fas fa-arrow-up"></i></button>
    <div class="cart-float" onclick="openWA()"><i class="fas fa-shopping-bag" style="color:white; font-size:24px;"></i><span id="cartCount" style="position:absolute; top:0; right:0; background:white; color:black; border-radius:50%; width:20px; height:20px; font-size:11px; display:flex; align-items:center; justify-content:center;">0</span></div>

    <script>
        const SHEET_ID = '1vXPi8s4eXqA_2X5Bo9iW6jOWqV2-cV70CN0jde2L7A0';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;
        let db = [], sliderData = [], cart = [], slideIdx = 0, activeCat = 'All', isAr = false, selectedP = null, selectedS = '';

        // BACK BUTTON & DYNAMIC TITLE FIX
        const ORIGINAL_TITLE = "Abaya Hub UAE | Best Abaya Wholesaler in UAE & Dubai";
        function pushState(title) { 
            history.pushState({modalOpen: true}, null, ""); 
            if(title) document.title = title + " | Abaya Hub UAE";
        }
        window.onpopstate = function(e) {
            if (document.getElementById('fullView').style.display === 'flex') closeFullView();
            else if (document.getElementById('productModal').style.display === 'flex') closeModal();
            document.title = ORIGINAL_TITLE;
        };

        async function init() {
            try {
                const res = await fetch(CSV_URL);
                const data = await res.text();
                const rows = data.split(/\r?\n/).slice(1);
                db = rows.map(row => {
                    const cols = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    const cat = cols[8]?.trim();
                    let img = (cols[6] && cols[6].length > 10) ? cols[6].replace(/"/g, '') : cols[5].replace(/"/g, '');
                    if(cat === "Slider" && img && !img.includes('/')) img = "Banner/" + img;
                    return { id: cols[0], name: cols[1], price: cols[2], image: img, cat: cat, desc: cols[7], sizes: cols[9]?.replace(/"/g, '').split(',') || [] };
                }).filter(p => p.name);
                sliderData = db.filter(p => p.cat === "Slider");
                if(sliderData.length > 0) document.getElementById('sliderTrack').innerHTML = sliderData.map(s => `<div class="slide"><img src="${s.image}" alt="Banner"></div>`).join('');
                applyFilters(); generateCats();
            } catch (e) { console.error(e); }
        }

        function render(items) {
            document.getElementById('productGrid').innerHTML = items.map(p => `
                <article class="abaya-card" onclick="openModal('${p.id}')">
                    <img src="${p.image}" alt="${p.name}">
                    <div style="padding:10px;"><p style="font-size:12px; color:#aaa;">${p.name}</p><p style="color:var(--primary-pink); font-weight:bold;">${isAr?'درهم':'AED'} ${p.price}</p></div>
                </article>`).join('');
        }

        function openModal(id) {
            selectedP = db.find(x => x.id === id); 
            document.getElementById('mName').innerText = selectedP.name;
            document.getElementById('mImg').src = selectedP.image;
            document.getElementById('mDesc').innerText = selectedP.desc;
            let sizeHtml = '';
            selectedP.sizes.forEach(s => { if(s.trim()) sizeHtml += `<div class="size-opt" onclick="selectSize('${s.trim()}', this)">${s.trim()}</div>`; });
            document.getElementById('mSizes').innerHTML = sizeHtml;
            document.getElementById('productModal').style.display = 'flex';
            
            // SEO: Update Title on open
            pushState(selectedP.name); 

            gsap.fromTo("#modalContent", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.7)" });
            const related = db.filter(p => p.cat === selectedP.cat && p.id !== selectedP.id).slice(0, 8);
            document.getElementById('relatedSection').innerHTML = related.map(r => `<div class="rel-card" onclick="openModal('${r.id}')"><img src="${r.image}" alt="${r.name}"><p>${r.name.substring(0,12)}..</p></div>`).join('');
            document.getElementById('modalContent').scrollTop = 0;
        }

        /* --- PINCH ZOOM LOGIC --- */
        let scale = 1, startDist = 0;
        const fullView = document.getElementById('fullView');
        const fImg = document.getElementById('fImg');

        function openFullView() {
            fImg.src = document.getElementById('mImg').src;
            fullView.style.display = 'flex';
            pushState(selectedP.name + " Zoom"); 
            scale = 1; fImg.style.transform = `scale(1)`;
        }
        function closeFullView() { fullView.style.display = 'none'; scale = 1; fImg.style.transform = `scale(1)`; }

        fullView.addEventListener('touchstart', e => {
            if (e.touches.length === 2) startDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
        });
        fullView.addEventListener('touchmove', e => {
            if (e.touches.length === 2) {
                const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                scale = Math.max(1, dist / startDist);
                fImg.style.transform = `scale(${scale})`;
            }
        });
        fullView.addEventListener('touchend', e => {
            if(scale < 1.1) { scale = 1; fImg.style.transform = `scale(1)`; }
        });

        /* --- UTILS --- */
        function selectSize(s, el) { selectedS = s; document.querySelectorAll('.size-opt').forEach(o => o.classList.remove('selected')); el.classList.add('selected'); }
        function toggleCustom() { const b = document.getElementById('mCustomBox'); b.style.display = b.style.display==='block'?'none':'block'; selectedS='Custom'; }
        function closeModal() { 
            gsap.to("#modalContent", { scale: 0.8, opacity: 0, duration: 0.3, onComplete: () => {
                document.getElementById('productModal').style.display = 'none';
                document.title = ORIGINAL_TITLE;
                if(history.state && history.state.modalOpen) history.back();
            }});
        }
        function confirmOrder() { if(!selectedS) return alert("Select Size!"); cart.push({...selectedP, finalSize: selectedS}); document.getElementById('cartCount').innerText = cart.length; closeModal(); }
        function setCategory(cat) { activeCat = cat; applyFilters(); generateCats(); }
        function applyFilters() { const q = document.getElementById('searchBar').value.toLowerCase(); const filtered = db.filter(p => p.cat !== 'Slider' && (activeCat === 'All' || p.cat === activeCat) && (p.name.toLowerCase().includes(q) || p.desc.toLowerCase().includes(q))); render(filtered); }
        function generateCats() { const cats = ['All', ...new Set(db.filter(p => p.cat && p.cat !== "Slider").map(p => p.cat))]; document.getElementById('dynamicCats').innerHTML = cats.map(c => `<button class="cat-btn ${c===activeCat?'active':''}" onclick="setCategory('${c}')">${c}</button>`).join(''); }
        function moveSlide(dir) { slideIdx = (slideIdx + dir + sliderData.length) % sliderData.length; document.getElementById('sliderTrack').style.transform = `translateX(-${slideIdx * 100}%)`; }
        function openWA() { if(cart.length === 0) return alert("Empty!"); let m = "Assalamu Alaikum, I want to Order This:\n"; cart.forEach((it, i) => m += `${i+1}. ${it.name} - Size: ${it.finalSize}\n`); window.open(`https://wa.me/971568679647?text=${encodeURIComponent(m)}`); }
        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }
        window.onscroll = () => { document.getElementById("backToTop").style.display = window.scrollY > 500 ? "flex" : "none"; };

        document.addEventListener("DOMContentLoaded", () => {
            setTimeout(() => { gsap.to("#preloader", { opacity: 0, onComplete: () => { document.getElementById('preloader').style.display = 'none'; let tl = gsap.timeline(); tl.to("#welcomeMessage", { opacity: 1, y: 0, duration: 0.8 }).to("#welcomeMessage", { opacity: 0, duration: 0.6, delay: 3 }).to("#heroSlider", { visibility: "visible", opacity: 1, onComplete: () => setInterval(()=>moveSlide(1), 10000) }); } }); }, 1500);
            init();
        });
    </script>
</body>
</html>
