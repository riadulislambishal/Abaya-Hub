<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Abaya Hub UAE</title>
    <meta name="title" content="Abaya Hub UAE | Modern Luxury Abayas in Ajman">
    <meta name="description" content="Shop Abaya Hub UAE for premium stylish abayas, luxurious fabrics, and exclusive Dubai designs. Wholesale & Retail shipping from Ajman worldwide.">
    <meta name="description" lang="ar" content="أبايا هاب الإمارات - بوتيك عبايات عصري حصري في عجمان. تصاميم فاخرة تشمل العبايات الإيرانية والخليجية. توصيل بالجملة والتجزئة لجميع أنحاء العالم.">
    <meta name="keywords" content="Abaya Hub UAE, Best Abaya Of Dubai, Best abaya UAE, World Best Abaya, Abayahub.uae, Abaya Dubai, Black Abaya, New Abaya Collection, Stylish Abaya, Premium Fabric, Luxury Abaya, Embroidery Designed Abaya, Hand Crafted Abaya, Stone Abaya, Scarf Abaya, Inner Abaya, Modern Abaya Fashion, Ajman Abaya Shop, عبايات, عبايات عجمان, عبايات دبي, عبايات خليجية, عبايات سوداء, تصميم عبايات, عبايات فاخرة, موديلات عبايات جديدة, عبايات مطرزة, عبايات شيك">

    <link rel="icon" type="image/png" href="icon.png">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#050505">

    <meta property="og:title" content="Abaya Hub UAE | Modern Luxury Boutique">
    <meta property="og:description" content="Premium Abayas delivered from Ajman to the World. Best quality Gulf & Irani designs.">
    <meta property="og:image" content="icon.png"> 
    <meta property="og:url" content="https://abayahubuae.shop/">
    <meta property="og:type" content="website">

    <link rel="canonical" href="https://abayahubuae.shop/">
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Tenor+Sans&family=Cairo:wght@300;600;700&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        :root {
            --primary-pink: #f4aaff; 
            --deep-pink: #ff00ff;
            --white: #ffffff;
            --black: #050505;
            --text-gradient: linear-gradient(180deg, #ffffff 0%, #f4aaff 100%);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tenor Sans', sans-serif; }
        body { background-color: var(--black); color: var(--white); overflow-x: hidden; }

        #preloader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--black); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .loader-logo { height: 80px; opacity: 0; transform: scale(0.8); margin-bottom: 20px; }
        .enter-btn { background: transparent; border: 1px solid var(--primary-pink); color: var(--primary-pink); padding: 10px 30px; letter-spacing: 3px; cursor: pointer; opacity: 0; transition: 0.3s; }
        .enter-btn:hover { background: var(--primary-pink); color: var(--black); }

        nav { padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: fixed; width: 100%; top: 0; z-index: 1000; background: rgba(5, 5, 5, 0.9); backdrop-filter: blur(15px); border-bottom: 1px solid rgba(244, 170, 255, 0.3); }
        .logo-img { height: 50px; object-fit: contain; }

        .hero { height: 100vh; width: 100%; position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #heroVideo { position: absolute; top: 50%; left: 50%; min-width: 100%; min-height: 100%; transform: translate(-50%, -50%); object-fit: cover; z-index: 1; filter: brightness(0.4); }
        .hero-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(0,0,0,0.3), rgba(244, 170, 255, 0.2)); z-index: 2; }
        .hero-content { text-align: center; z-index: 10; padding: 0 20px; }
        .welcome-text { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.6rem; color: var(--primary-pink); margin-bottom: 10px; display: block; opacity: 0; }
        .hero-content h1 { font-family: 'Cinzel', serif; font-size: clamp(35px, 9vw, 85px); letter-spacing: 8px; line-height: 1.1; margin-bottom: 20px; opacity: 0; transform: translateY(50px); background: var(--text-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-content p { color: var(--white); letter-spacing: 6px; font-size: 0.85rem; text-transform: uppercase; opacity: 0; }

        .section-tag { padding: 80px 5% 40px; text-align: center; }
        .section-tag h2 { font-family: 'Cinzel', serif; font-size: 2.2rem; background: var(--text-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .collection-grid { display: flex; flex-direction: column; align-items: center; gap: 40px; padding: 0 5% 100px; }
        .abaya-card { width: 100%; max-width: 450px; height: 65vh; position: relative; overflow: hidden; border-radius: 20px; border: 1px solid rgba(244, 170, 255, 0.3); background: #111; }
        .abaya-card img { width: 100%; height: 100%; object-fit: cover; opacity: 0.9; cursor: zoom-in; }

        .info-panel { position: absolute; bottom: 15px; left: 15px; right: 15px; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(12px); padding: 18px; border: 1px solid rgba(244, 170, 255, 0.2); border-radius: 12px; display: flex; justify-content: space-between; align-items: center; }
        .price-tag { color: var(--primary-pink); font-weight: bold; font-size: 1.3rem; }
        .order-btn { background: linear-gradient(45deg, var(--deep-pink), var(--primary-pink)); color: white; padding: 10px 20px; text-decoration: none; border-radius: 50px; font-size: 0.85rem; font-weight: bold; }

        .social-footer { padding: 60px 5% 100px; text-align: center; border-top: 1px solid rgba(244, 170, 255, 0.1); }
        .social-icons { display: flex; justify-content: center; gap: 35px; margin-top: 25px;}
        .social-icons a { color: var(--white); font-size: 30px; transition: 0.3s; }
        .social-icons a:hover { color: var(--primary-pink); transform: scale(1.2); }

        .wp-float { position: fixed; bottom: 25px; right: 25px; width: 60px; height: 60px; background: #25D366; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 30px; color: white; z-index: 2000; }

        /* --- OVERLAY STYLES --- */
        .img-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.98); z-index: 3000; justify-content: center; align-items: center; }
        .img-overlay img { max-width: 95%; max-height: 80%; border-radius: 10px; transition: 0.3s; }
        
        .close-overlay { position: absolute; top: 25px; right: 25px; background: rgba(244, 170, 255, 0.2); border: 1px solid var(--primary-pink); color: var(--primary-pink); width: 40px; height: 40px; border-radius: 50%; font-size: 20px; cursor: pointer; z-index: 3005; display: flex; justify-content: center; align-items: center; }

        .desc-panel { 
            position: absolute; bottom: -100%; left: 0; width: 100%; 
            background: linear-gradient(to top, rgba(0,0,0,1) 70%, rgba(0,0,0,0));
            padding: 60px 5% 30px; text-align: center; z-index: 3001; 
            transition: bottom 0.6s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .desc-panel.active { bottom: 0; }
        .desc-panel h3 { font-family: 'Cinzel', serif; color: var(--primary-pink); font-size: 1.4rem; margin-bottom: 8px; }
        .desc-panel p { font-size: 0.95rem; color: #ddd; font-style: italic; line-height: 1.5; margin-bottom: 20px; }

        .rtl { direction: rtl; font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body id="body">

    <div id="preloader">
        <img src="logo.png" alt="Abaya Hub" class="loader-logo" id="loadLogo">
        <button class="enter-btn" id="enterBtn" onclick="startExperience()">ENTER OUR SHOP</button>
    </div>

    <audio id="welcomeAudio"><source src="welcome.mp3" type="audio/mpeg"></audio>
    
    <div class="img-overlay" id="imgOverlay">
        <button class="close-overlay" onclick="closeOverlay()">✕</button>
        <img id="fullImg" src="" onclick="toggleDesc()">
        <div class="desc-panel" id="descPanel">
            <h3 id="descName">Abaya Name</h3>
            <p id="descText">Abaya Description</p>
            <a href="#" id="descOrderBtn" class="order-btn">ORDER NOW</a>
        </div>
    </div>

    <nav>
        <img src="logo.png" alt="Abaya Hub" class="logo-img" onerror="this.style.display='none'; document.getElementById('altLogo').style.display='block'">
        <div id="altLogo" style="display:none; color:var(--primary-pink); font-family: 'Cinzel', serif; font-size: 20px;">Abaya Hub</div>
        <button onclick="toggleLang()" id="langBtn" style="background:transparent; color:var(--primary-pink); border:1px solid var(--primary-pink); padding:6px 15px; cursor:pointer; font-weight: bold; border-radius: 4px;">ARABIC</button>
    </nav>

    <section class="hero">
        <video autoplay muted loop playsinline id="heroVideo"><source src="banner.mp4" type="video/mp4"></video>
        <div class="hero-overlay"></div>
        <div class="hero-content">
            <span class="welcome-text" id="welcome">Welcome to our</span>
            <h1 id="mainH">ABAYA HUB</h1>
            <p id="subP">Exclusive Modern UAE Boutique</p>
        </div>
    </section>

    <div class="section-tag"><h2 id="secH">Modern Signature</h2></div>
    <div class="collection-grid" id="productGrid">
        <p id="loadingMsg" style="color:gray;">Loading Boutique Inventory...</p>
    </div>

    <div class="social-footer">
        <h3 id="followText">Follow Our Journey</h3>
        <div class="social-icons">
            <a href="https://www.instagram.com/abayahub_uae" target="_blank"><i class="fab fa-instagram"></i></a>
            <a href="https://www.facebook.com/abayahubuae" target="_blank"><i class="fab fa-facebook"></i></a>
            <a href="https://www.tiktok.com/@abayahub.uae" target="_blank"><i class="fab fa-tiktok"></i></a>
        </div>
    </div>

    <a href="https://wa.me/971568679647" class="wp-float"><i class="fab fa-whatsapp"></i></a>

    <script>
        const SHEET_ID = '1vXPi8s4eXqA_2X5Bo9iW6jOWqV2-cV70CN0jde2L7A0';
        const CSV_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/export?format=csv&gid=0`;

        let productsData = [];
        let isAr = false;

        async function fetchProducts() {
            try {
                const response = await fetch(CSV_URL);
                const data = await response.text();
                const rows = data.split(/\r?\n/).slice(1);
                
                productsData = rows.map(row => {
                    const columns = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    return {
                        id: columns[0]?.replace(/"/g, ''),
                        name: columns[1]?.replace(/"/g, ''),
                        price: columns[2]?.replace(/"/g, ''),
                        folder_image: columns[3]?.replace(/"/g, ''),
                        link_image: columns[4]?.replace(/"/g, ''),
                        description: columns[5]?.replace(/"/g, '')
                    };
                });
                renderProducts(isAr ? 'ar' : 'en');
            } catch (error) {
                console.error("Database error:", error);
                document.getElementById('loadingMsg').innerText = "Syncing failed. Loading samples...";
            }
        }

        function renderProducts(lang = 'en') {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = "";
            
            productsData.forEach(item => {
                if(!item.name || item.name.trim() === "") return;
                
                const imgSource = (item.link_image && item.link_image.trim().length > 10) ? item.link_image.trim() : item.folder_image.trim();
                const displayPrice = lang === 'en' ? `AED ${item.price}` : `${toArNum(item.price)} درهم`;
                const btnText = lang === 'en' ? `ORDER NOW` : `اطلب الآن`;
                
                let displayName = item.name;
                if(lang === 'ar') displayName = item.name.replace(/Modern Signature #/g, 'تصميم عصري #').replace(/\d+/g, toArNum);

                const safeName = displayName.replace(/'/g, "\\'");
                const safeDesc = item.description.replace(/'/g, "\\'");
                const wpMsg = encodeURIComponent(`Assalamu Alaikum, I want to order: ${item.name} (${item.price} AED).`);

                grid.innerHTML += `
                    <div class="abaya-card">
                        <img src="${imgSource}" alt="${item.name}" 
                             onclick="openFullExperience('${imgSource}', '${safeName}', '${safeDesc}', '${wpMsg}')" 
                             onerror="this.src='https://via.placeholder.com/500x700?text=Abaya+Hub'">
                        <div class="info-panel">
                            <div>
                                <p style="font-size: 11px; color: #aaa; margin-bottom: 5px;">${displayName}</p>
                                <div class="price-tag">${displayPrice}</div>
                            </div>
                            <a href="https://wa.me/971568679647?text=${wpMsg}" class="order-btn">${btnText}</a>
                        </div>
                    </div>`;
            });
        }

        const toArNum = (n) => String(n).replace(/\d/g, d => "٠١٢٣٤٥٦٧٨٩"[d]);

        function startExperience() {
            document.getElementById('welcomeAudio').play().catch(() => {});
            gsap.to("#preloader", { opacity: 0, duration: 1, onComplete: () => {
                document.getElementById('preloader').style.display = 'none';
                let tl = gsap.timeline();
                tl.to("#welcome", { opacity: 1, duration: 0.8 })
                  .to("#mainH", { opacity: 1, y: 0, duration: 1, ease: "power3.out" }, "-=0.3")
                  .to("#subP", { opacity: 1, letterSpacing: "10px", duration: 1.2 }, "-=0.5");
            }});
        }

        function openFullExperience(src, name, desc, wp) {
            const overlay = document.getElementById('imgOverlay');
            document.getElementById('fullImg').src = src;
            document.getElementById('descName').innerText = name;
            document.getElementById('descText').innerText = desc;
            const orderBtn = document.getElementById('descOrderBtn');
            orderBtn.href = `https://wa.me/971568679647?text=${wp}`;
            orderBtn.innerText = isAr ? "اطلب الآن" : "ORDER NOW";

            overlay.style.display = 'flex';
            setTimeout(() => { document.getElementById('descPanel').classList.add('active'); }, 100);
        }

        function closeOverlay() {
            document.getElementById('descPanel').classList.remove('active');
            setTimeout(() => { document.getElementById('imgOverlay').style.display = 'none'; }, 400);
        }

        function toggleDesc() { document.getElementById('descPanel').classList.toggle('active'); }

        function toggleLang() {
            isAr = !isAr;
            const body = document.getElementById('body');
            const btn = document.getElementById('langBtn');
            
            const txt = {
                welcome: isAr ? "مرحباً بكم في" : "Welcome to our",
                mainH: isAr ? "أبايا هاب" : "ABAYA HUB",
                subP: isAr ? "بوتيك العبايات العصرية الحصرية" : "Exclusive Modern UAE Boutique",
                secH: isAr ? "التوقيع العصري" : "Modern Signature",
                followText: isAr ? "تابعوا رحلتنا" : "Follow Our Journey"
            };

            Object.keys(txt).forEach(id => {
                const el = document.getElementById(id);
                if(el) el.innerText = txt[id];
            });

            isAr ? body.classList.add('rtl') : body.classList.remove('rtl');
            btn.innerText = isAr ? "ENGLISH" : "ARABIC";
            renderProducts(isAr ? 'ar' : 'en');
        }

        document.addEventListener("DOMContentLoaded", () => {
            gsap.to("#loadLogo", { opacity: 1, scale: 1, duration: 1.5 });
            gsap.to("#enterBtn", { opacity: 1, duration: 1, delay: 0.8 });
            fetchProducts();
        });
    </script>
</body>
</html>
